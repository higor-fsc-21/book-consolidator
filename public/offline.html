<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172f3b" />
    <title>Memora indisponível</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, serif;
        background: #fbf9f8;
        color: #172f3b;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        max-width: 440px;
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1;
      }

      p {
        margin: 0;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        color: #53636a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão.</h1>
      <p>O Memora volta a funcionar assim que a conexão for restabelecida.</p>
    </main>
  </body>
</html>
