services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memora}
      POSTGRES_DB: ${POSTGRES_DB:-memora}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - memora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-memora} -d ${POSTGRES_DB:-memora}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-memora}:${POSTGRES_PASSWORD:-memora}@postgres:5432/${POSTGRES_DB:-memora}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-memora}:${POSTGRES_PASSWORD:-memora}@postgres:5432/${POSTGRES_DB:-memora}?schema=public
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      NODE_ENV: production
      PORT: 3000
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm start"]
    ports:
      - "${APP_PORT:-8443}:3000"

volumes:
  memora_postgres_data:
